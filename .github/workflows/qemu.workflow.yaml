name: qemu-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    run-qemu-test:
        runs-on: self-hosted
        timeout-minutes: 120
        steps:
          - uses: actions/checkout@v2
            with:
              clean: false
          - name: Build qemu image
            run: ./tests/validate_qemu.sh build
          - name: Start qemu image
            run: ./tests/validate_qemu.sh start
          - name: Test ssh access
            run: ./tests/validate_qemu.sh ssh
          - name: Check if mqtt subscriber is running
            run: ./tests/validate_qemu.sh mqtt-subscriber
          - name: Run publish-subscribe test via standalone mqtt subscriber
            run: ./tests/validate_qemu.sh mqtt-pub-sub
          - name: Check if kernel module is loaded
            run: ./tests/validate_qemu.sh mqttlog-module
          - name: Run json parse tests for module
            run: ./tests/validate_qemu.sh mqttlog-parse
          - name: Run simple echo/cat test for module
            run: ./tests/validate_qemu.sh mqttlog-cat
          - name: Run buffer size test for module
            run: ./tests/validate_qemu.sh mqttlog-buffer-size
          - name: Run publish-subscribe test via kernel module
            run: ./tests/validate_qemu.sh mqttlog-pub-sub
          - name: Stop qemu image
            if: always()
            run: ./tests/validate_qemu.sh stop
          - name: Cleanup
            if: always()
            run: |
              ssh-add -D
