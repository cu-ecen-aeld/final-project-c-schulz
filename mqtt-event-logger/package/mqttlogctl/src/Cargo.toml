[package]
name = "mqttlogctl"
version = "1.0.0"
edition = "2024"
authors = ["Cornelia Schulz"]

[dependencies]
nix = { version = "0.30", features = ["ioctl"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"